<div class="flex flex-col relative h-full">
  <mat-toolbar-row
    class="absolute top-0 left-0 right-0 flex items-center z-10 justify-between bg-linear-to-b from-olive-500 to-olive-300"
  >
    <div>
      <a mat-button href="#home" style="color: var(--color-gray-900)">Home</a>
      <a mat-button href="#gallery" style="color: var(--color-gray-900)">Gallery</a>
    </div>
    <div class="p-2 flex gap-4 items-center">
      <current-user></current-user>
      <button>
        <mat-icon aria-hidden="false" aria-label="home icon" fontIcon="home"></mat-icon>
      </button>
      <button>
        <mat-icon
          aria-hidden="false"
          aria-label="settings home icon"
          fontIcon="settings"
        ></mat-icon>
      </button>
    </div>
  </mat-toolbar-row>

  <div class="flex-1 p-32 pb-0 bg-olive-300 flex flex-col font-mono">
    <header
      class="bg-slate-300 py-8 px-4 border border-stone-400 shadow-xl/30 flex items-center justify-center rounded-xl"
    >
      <p class="text-3xl font-bold text-gray-900">Dog Gallery</p>
    </header>

    <div class="pt-32 flex flex-col md:grid grid-cols-3 gap-6">
      <div
        class="bg-slate-300 px-8 py-4 border border-olive-400 shadow-xl/30 flex flex-col items-center justify-center rounded-xl"
      >
        <h2 class="text-slate-900 font-semibold">First dog breed</h2>
        <p class="text-sm text-gray-500">
          This is the detailed description of the first breed, alright...
        </p>
      </div>

      <div
        class="bg-slate-300 pt-8 pb-8 pl-4 pr-4 border border-olive-400 shadow-xl/30 flex flex-col items-center justify-center rounded-xl"
      >
        <h2 class="text-slate-900 font-semibold">Second dog breed</h2>
        <p class="text-sm text-gray-500">
          This is the detailed description of the second breed, alright...
        </p>
      </div>

      <div
        class="bg-slate-300 pt-8 pb-8 pl-4 pr-4 border border-olive-400 shadow-xl/30 flex flex-col items-center justify-center rounded-xl"
      >
        <h2 class="text-slate-900 font-semibold">First dog breed</h2>
        <p class="text-sm text-gray-500">
          This is the detailed description of the first breed, alright...
        </p>
      </div>
    </div>

    <image-viewer></image-viewer>
  </div>

  <div
    class="flex flex-col items-center justify-center w-full py-20 bg-linear-to-b from-olive-300 to-olive-500 text-white/70"
  ></div>
</div>
