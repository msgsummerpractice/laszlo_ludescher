name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          # FIX: Changed Windows backslashes (\) to Linux forward slashes (/)
          cache-dependency-path: self_learning/angular/ng-app/package-lock.json

      - name: Install dependencies
        # FIX: Changed backslashes to forward slashes
        working-directory: self_learning/angular/ng-app
        run: npm ci

      - name: Build Angular
        # FIX: Changed backslashes to forward slashes
        working-directory: self_learning/angular/ng-app
        run: npm run build

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        # FIX: Added environment block to force the Azure Action to recognize Node 24
        env:
          NODE_VERSION: 24
          FORWARD_APP_BUILD_LOGS: true
          FORWARD_OUTPUT_PREBUILT: true
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_SAND_0ED290D03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload

          skip_app_build: true

          # Double-check this path matches where your "Build Angular" step actually outputs files
          app_location: "frontend/training-app/dist/training-app/browser"
          output_location: ""
          api_location: ""

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'

    runs-on: ubuntu-latest

    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_SAND_0ED290D03 }}
          action: close
